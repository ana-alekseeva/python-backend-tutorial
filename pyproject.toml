[project]
name = "chatbot-api"
version = "0.1.0"
description = "Backbone chatbot backend: FastAPI + Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.140.13",
    "itsdangerous>=2.2.0",
    "openai>=2.49.0",
    "pydantic-settings>=2.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: undefined names, unused imports
    "I",    # isort: import order
    "UP",   # pyupgrade: modern syntax for the target version
    "B",    # bugbear: likely bugs, e.g. mutable default arguments
    "SIM",  # simplify
    "RUF",  # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: names are imported to be part of the package's public surface.
"app/agent/__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
